name: DealBot 24/7

# FREE 24/7 HOSTING: GitHub Actions runs one check cycle every 5 minutes.
# The rotation cursor + price history live in data/deals.db which is
# committed back after every run, so sweeps continue seamlessly.
#
# Setup (3 minutes):
#   1. Create a GitHub repo and upload this whole folder (including .github)
#   2. Settings > Secrets and variables > Actions > New repository secret:
#        Name:  TELEGRAM_BOT_TOKEN
#        Value: your bot token
#   3. Done. Alerts flow to your registered Telegram chats forever, free.
#
# The token is read from the TELEGRAM_BOT_TOKEN secret, so it never lives
# in the code - safe for public repos (public = unlimited free Actions minutes).

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: dealbot
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run one check cycle
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python bot.py --once

      - name: Save price history back to repo
        run: |
          sqlite3 data/deals.db "PRAGMA wal_checkpoint(TRUNCATE);" || true
          git config user.name "dealbot"
          git config user.email "dealbot@users.noreply.github.com"
          git add data/deals.db data/deals.db-wal 2>/dev/null || git add data/deals.db
          git diff --cached --quiet || (git commit -m "price history update [skip ci]" && git push)
